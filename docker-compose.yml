services:
  postgres:
    image: postgres:17-alpine
    container_name: siteyonetim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-siteyonetim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-siteyonetim}
      POSTGRES_DB: ${POSTGRES_DB:-siteyonetim}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-siteyonetim} -d ${POSTGRES_DB:-siteyonetim}"]
      interval: 5s
      timeout: 5s
      retries: 10
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - shared_buffers=128MB

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: siteyonetim-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-siteyonetim}:${POSTGRES_PASSWORD:-siteyonetim}@postgres:5432/${POSTGRES_DB:-siteyonetim}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET .env icinde zorunlu}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET .env icinde zorunlu}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      UPLOAD_DIR: /app/data/uploads
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      RUN_MIGRATE_ON_START: "true"
      RUN_SEED_ON_START: "true"
    volumes:
      - upload_data:/app/data/uploads
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:alpine
    container_name: siteyonetim-nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  upload_data:
